<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSS Due Diligence</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6676; --line: #e1e4ea;
    --accent: #2f5bd3; --accent-text: #ffffff; --user: #e8eefc; --code: #f1f3f6;
    --green: #1f8a4c; --yellow: #b7791f; --red: #c53030; --grey: #8a93a3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2; --line: #2d333d;
            --accent: #6b8ff0; --accent-text: #0e1116; --user: #243150; --code: #252a33;
            --green: #48bb78; --yellow: #ecc94b; --red: #fc8181; --grey: #7c8494; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 860px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 18px 0 10px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  #log { flex: 1; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 100%; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
         overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-color: transparent; max-width: 80%; }
  .msg.error { border-color: var(--red); color: var(--red); }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin-bottom: 0; }
  .head { font-weight: 600; }
  .overall { display: inline-block; margin: 4px 0 8px; padding: 2px 10px; border-radius: 99px; font-weight: 600; font-size: 14px;
             border: 1px solid currentColor; }
  .s-green { color: var(--green); } .s-yellow { color: var(--yellow); } .s-red { color: var(--red); } .s-not_checked { color: var(--grey); }
  .area { border-top: 1px solid var(--line); padding: 8px 0; }
  .area .name { font-weight: 600; font-size: 13px; letter-spacing: .04em; }
  .area .tag { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .quote { margin: 4px 0 0; padding: 4px 8px; background: var(--code); border-radius: 6px; font-size: 13px; }
  .src { font-size: 12px; margin-top: 2px; } .src a { color: var(--accent); }
  .ok { color: var(--green); } .bad { color: var(--red); font-weight: 600; }
  .small { color: var(--muted); font-size: 13px; }
  ul { margin: 4px 0 6px 18px; padding: 0; }
  details { margin-top: 8px; font-size: 12px; color: var(--muted); }
  details pre { white-space: pre-wrap; background: var(--code); padding: 8px; border-radius: 6px; overflow-x: auto; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  form { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 16px; display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
                     background: var(--panel); color: var(--text); font: inherit; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent);
           color: var(--accent-text); font: inherit; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { font-size: 13px; padding: 5px 10px; background: transparent; color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>OSS Due Diligence</h1>
    <p>Ask whether an open-source component is safe to adopt. Every finding links to its evidence.</p>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <input id="input" type="text" autocomplete="off" placeholder="e.g. Can we use pallets/flask in a commercial product?">
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
const ICON = { green: "🟢", yellow: "🟡", red: "🔴", not_checked: "⚪" };
const VERDICT = { green: "OK to use", yellow: "Usable with conditions", red: "Do not adopt without review",
                  not_checked: "Not enough information" };
const AREAS = ["licence", "security", "maintenance", "privacy", "skills"];
const EXAMPLES = ["Can we use pallets/flask in a commercial product?",
                  "Can we self-host n8n-io/n8n for workflows with customer data?",
                  "Our portal runs PHP 8.1 (php/php-src). Do we need to act?",
                  "Can we add axios/axios to our new web app?",
                  "MIT vs GPL: which is safer for us?"];

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
let threadId = null;   // set while the agent waits for an answer to its question
let busy = false;

// ---------- tiny DOM helpers (textContent only: tool output can never inject HTML) ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function link(url) {
  if (!/^https:\/\//.test(url || "")) return el("span", "", url || "");
  const a = el("a", "", url);
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
function bubble(cls) {
  const m = el("div", "msg " + cls);
  log.appendChild(m);
  m.scrollIntoView({ behavior: "smooth", block: "end" });
  return m;
}
function plain(text, cls = "") {  // direct answers: keep paragraphs, show **bold** as bold
  const m = bubble(cls);
  for (const para of String(text).split(/\n{2,}/)) {
    const p = el("p");
    para.split(/(\*\*[^*]+\*\*)/).forEach(part => {
      if (/^\*\*[^*]+\*\*$/.test(part)) p.appendChild(el("strong", "", part.slice(2, -2)));
      else part.split("\n").forEach((line, i) => { if (i) p.appendChild(el("br")); p.appendChild(document.createTextNode(line)); });
    });
    m.appendChild(p);
  }
  return m;
}
function list(parent, title, items) {
  if (!items || !items.length) return;
  parent.appendChild(el("div", "head", title));
  const ul = el("ul");
  items.forEach(i => ul.appendChild(el("li", "", i)));
  parent.appendChild(ul);
}

// ---------- report card ----------
function renderReport(r) {
  const m = bubble("");
  const commit = r.commit ? "@ " + r.commit.slice(0, 7) : "(no commit checked)";
  m.appendChild(el("div", "head", `${r.repo} ${commit} · checked ${r.checked_on}`));
  m.appendChild(el("div", "overall s-" + r.overall, `${ICON[r.overall]} ${r.headline || VERDICT[r.overall]}`));
  if (r.package_location) {  // monorepo: the package is one folder of a bigger repo
    const p = el("p", "small", "Package lives in " + r.package_location + " → ");
    p.appendChild(link(r.package_url));
    m.appendChild(p);
  }
  if (r.assumptions && r.assumptions.length) m.appendChild(el("p", "small", "Assumed: " + r.assumptions.join(" · ")));

  let shown = AREAS;
  if (r.previous) {  // re-check: only what changed, the rest on one line
    const same = r.previous.commit === r.commit ? "same commit" : "was @ " + (r.previous.commit || "?").slice(0, 7);
    m.appendChild(el("p", "small", `Re-check of ${r.previous.checked_on} (${same}, previous overall ${ICON[r.previous.overall] || "?"})`));
    shown = r.changed_areas || [];
    m.appendChild(el("p", "", shown.length ? "Changed: " + shown.map(a => a.toUpperCase()).join(", ") : "Changed: nothing"));
    const same_areas = AREAS.filter(a => !shown.includes(a)).map(a => `${a.toUpperCase()} ${ICON[r.areas[a].status]}`);
    if (same_areas.length) m.appendChild(el("p", "small", "Unchanged since last check: " + same_areas.join(" · ")));
  }
  for (const name of shown) {
    const area = r.areas[name], box = el("div", "area");
    const title = el("div");
    title.appendChild(el("span", "name s-" + area.status, `${ICON[area.status]} ${name.toUpperCase()}`));
    const articles = (r.legal || []).filter(x => x.area === name).map(x => x.article);
    if (articles.length) title.appendChild(el("span", "tag", "(" + articles.join(", ") + ")"));
    if (area.carried_over) title.appendChild(el("span", "tag", "[from " + area.carried_over + "]"));
    box.appendChild(title);
    box.appendChild(el("div", "", area.summary));
    const f = (r.findings || []).filter(x => x.area === name).sort((a, b) => (b.verified === true) - (a.verified === true))[0];
    if (f) {
      box.appendChild(el("div", "quote", "“" + f.evidence_quote.replace(/\s+/g, " ") + "”"));
      const src = el("div", "src");
      src.appendChild(document.createTextNode("→ "));
      src.appendChild(link(f.url));
      src.appendChild(f.verified ? el("span", "ok", " ✔") : el("span", "bad", " ⚠ unverified"));
      box.appendChild(src);
    }
    if (name === "security") (r.per_version || []).forEach(row =>  // per-version verdicts, decided by code
      box.appendChild(el("div", "small s-" + row.status, `${ICON[row.status]} ${row.version}: ${row.detail}`)));
    m.appendChild(box);
  }
  list(m, "Conditions", r.conditions);
  list(m, "Open questions", r.open_questions);
  m.appendChild(el("div", "head", "Recommendation"));
  m.appendChild(el("p", "", r.recommendation));
  return m;
}

function renderTrace(parent, step) {
  const d = el("details");
  d.appendChild(el("summary", "", `${step.tool_calls} tool calls · ${step.questions} question${step.questions === 1 ? "" : "s"} · ${step.seconds} s · trace`));
  const lines = step.trace.map(t => {
    const what = t.tool ? `${t.tool} ${JSON.stringify(t.args).slice(0, 60)}` : t.detail;
    const extra = [t.tokens !== undefined ? t.tokens + " tok" : "", t.seconds !== undefined ? t.seconds + "s" : "",
                   t.tool ? t.detail : ""].filter(Boolean).join("  ");
    const row = `${String(t.step).padStart(2)} ${t.node.padEnd(12)} ${what}  ${extra}`;
    return t.plan ? `${row}\n   ${t.plan_kind}: ${t.plan.replace(/\s+/g, " ")}` : row;  // the model's own plan
  });
  d.appendChild(el("pre", "", lines.join("\n")));
  parent.appendChild(d);
}

// ---------- talking to the server ----------
async function call(path, body) {
  if (location.protocol === "file:")
    throw new Error("open the page from the server (http://127.0.0.1:8000), not as a file");
  let res;
  try {
    res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch (e) {  // no HTTP response at all
    throw new Error("cannot reach the server. Is `.venv/bin/python -m oss_agent.server` still running?");
  }
  const data = await res.json().catch(() => ({ error: "server returned no JSON" }));
  if (!res.ok || data.error) throw new Error(data.error || res.statusText);
  return data;
}

async function step(path, body) {
  setBusy(true);
  const wait = bubble("thinking");
  wait.textContent = "Checking… the agent is choosing and running tools (this can take up to a minute).";
  try {
    const data = await call(path, body);
    wait.remove();  // before rendering, so the last message is never the spinner
    handle(data);
  } catch (e) {
    threadId = null;
    bubble("error").textContent = "Error: " + e.message;
  } finally {
    wait.remove();
    setBusy(false);
  }
}

function handle(s) {
  if (s.status === "interrupt" && s.interrupt.type === "ask") {
    threadId = s.thread_id;  // the next message the user types is the answer
    plain("❓ " + s.interrupt.question);
    input.placeholder = "Type your answer…";
    input.focus();
    return;
  }
  if (s.status === "interrupt" && s.interrupt.type === "approve") {
    const card = renderReport(s.interrupt.report);
    approvalButtons(card, s.thread_id);
    return;
  }
  threadId = null;
  input.placeholder = "Ask about another component…";
  const m = s.report  // a report was already shown with the approval buttons; now confirm the decision
    ? plain(s.decision && s.decision.approved ? "✔ Saved to the register." : "Not saved.", "small")
    : plain(s.answer || "(no answer)");
  renderTrace(m, s);
}

function approvalButtons(card, id) {
  const row = el("div", "actions");
  const comment = el("input");
  comment.type = "text"; comment.placeholder = "Optional comment (e.g. internal use only)";
  const yes = el("button", "", "Approve & save");
  const no = el("button", "secondary", "Don't save");
  const decide = (answer) => { row.remove(); step("/api/resume", { thread_id: id, answer }); };
  yes.onclick = () => decide(("yes " + comment.value).trim());
  no.onclick = () => decide("no");
  row.append(comment, yes, no);
  card.appendChild(row);
  card.scrollIntoView({ behavior: "smooth", block: "end" });
}

function setBusy(b) {
  busy = b; send.disabled = b; input.disabled = b;
  if (!b) input.focus();
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  bubble("user").textContent = text;
  if (threadId) step("/api/resume", { thread_id: threadId, answer: text });
  else step("/api/start", { question: text });
});

// Welcome message with example questions.
const hello = bubble("");
hello.appendChild(el("p", "", "Hi! Name a GitHub repo and what you want to do with it. I check licence, security, maintenance and privacy, and show the evidence for every finding."));
const chips = el("div", "chips");
EXAMPLES.forEach(q => {
  const b = el("button", "", q);
  b.type = "button";
  b.onclick = () => { input.value = q; form.requestSubmit(); };
  chips.appendChild(b);
});
hello.appendChild(chips);
input.focus();
</script>
</body>
</html>
